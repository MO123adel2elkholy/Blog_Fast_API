<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Dashboard</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 0;
    }

    .header {
        background: #111827;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        border-bottom: 1px solid #1f2937;
    }

    .container {
        max-width: 700px;
        margin: 30px auto;
        padding: 10px;
    }

    .card {
        background: #1e293b;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 10px;
        border-left: 4px solid #38bdf8;
        animation: fadeIn 0.2s ease-in;
    }

    .type {
        font-size: 12px;
        color: #38bdf8;
        margin-bottom: 5px;
    }

    .content {
        font-size: 14px;
        color: #e2e8f0;
        word-break: break-word;
    }

    .status {
        text-align: center;
        margin-top: 10px;
        font-size: 13px;
        color: #94a3b8;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="header">
    ⚡️ Live Notifications Dashboard
</div>

<div class="container" id="container"></div>

<div class="status" id="status">Connecting...</div>

<script>
const container = document.getElementById("container");
const status = document.getElementById("status");

const eventSource = new EventSource("/server/stream");

// اتصال ناجح
eventSource.onopen = function () {
    status.innerText = "🟢 Connected";
};

// error handling
eventSource.onerror = function () {
    status.innerText = "🔴 Connection issue (retrying...)";
    window.location.href = "/admin/login";
};




// messages
eventSource.onmessage = function (event) {
    let data;

    try {
        data = JSON.parse(event.data);
    } catch (e) {
        console.error("Invalid SSE data:", event.data);
        return;
    }

    const card = document.createElement("div");
    card.className = "card";

    const type = document.createElement("div");
    type.className = "type";
    type.innerText = data.type || "UNKNOWN";

    const content = document.createElement("div");
    content.className = "content";
    content.innerText = JSON.stringify(data.data || {});

    card.appendChild(type);
    card.appendChild(content);

    container.prepend(card);
};
</script>

</body>
</html>
